name: Emscripten Development Build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: emscripten-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: shandalar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.0

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Configure CMake
        run: |
          emcmake cmake -S "${{ github.workspace }}" \
                       -B "${{ github.workspace }}/build-shandalar" \
                       -G Ninja \
                       -DCMAKE_BUILD_TYPE=Release \
                       -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="${{ github.workspace }}/out/shandalar" \
                       -DSHANDALAR_ASSET_DIR="${{ github.workspace }}/assets" \
                       -DSHANDALAR_BUILD_TESTS=OFF \
                       -DSHANDALAR_BUILD_FACEMAKER=OFF -DSHANDALAR_BUILD_SHANDALAR=ON -DSHANDALAR_BUILD_DECK=OFF

      - name: Build
        run: cmake --build "${{ github.workspace }}/build-shandalar"

      - name: Stamp version file
        run: printf '{"sha":"%s"}\n' "${GITHUB_SHA}" > "${{ github.workspace }}/out/shandalar/version.json"

      - name: Select R2 destination
        id: destination
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            directory="development/shandalar"
          else
            directory="development/branches/${GITHUB_REF_NAME}/shandalar"
          fi

          echo "directory=${directory}" >> "${GITHUB_OUTPUT}"

      - name: Upload to Cloudflare R2
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: shandalar-sdl3
          source-dir: ${{ github.workspace }}/out/shandalar
          destination-dir: ${{ steps.destination.outputs.directory }}
          output-file-url: false