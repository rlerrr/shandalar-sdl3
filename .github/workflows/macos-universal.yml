name: macOS Universal Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to build (64-bit code must come from x64-port)
        default: x64-port
        type: string

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: facemaker
            cmake_args: -DSHANDALAR_BUILD_FACEMAKER=ON -DSHANDALAR_BUILD_SHANDALAR=OFF -DSHANDALAR_BUILD_DECK=OFF
          - target: shandalar
            cmake_args: -DSHANDALAR_BUILD_FACEMAKER=OFF -DSHANDALAR_BUILD_SHANDALAR=ON -DSHANDALAR_BUILD_DECK=OFF
          - target: deck
            cmake_args: -DSHANDALAR_BUILD_FACEMAKER=OFF -DSHANDALAR_BUILD_SHANDALAR=OFF -DSHANDALAR_BUILD_DECK=ON

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Install dependencies
        run: brew install ninja || true

      - name: Configure + build per arch, then lipo (${{ matrix.target }})
        # NOTE: single-pass fat builds (-arch arm64 -arch x86_64 in one cc
        # invocation) are NOT used here on purpose. SDL_image's vendored
        # libwebp deliberately fails its SIMD detection for multi-arch
        # compiles and then forces -mno-sse2/-mno-sse4.1 onto generic sources,
        # which makes Xcode 26's math.h _Float16 declarations unavailable on
        # the x86_64 slice ("_Float16 is not supported on this target" in
        # sharpyuv). Single-arch builds detect SIMD normally and compile
        # cleanly, so build each arch separately and fuse with lipo.
        run: |
          for ARCH in arm64 x86_64; do
            cmake -S "${{ github.workspace }}" \
                  -B "${{ github.workspace }}/build-${{ matrix.target }}-${ARCH}" \
                  -G Ninja \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_OSX_ARCHITECTURES=${ARCH} \
                  -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
                  -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="${{ github.workspace }}/out/${{ matrix.target }}-${ARCH}" \
                  -DSHANDALAR_BUILD_TESTS=OFF \
                  ${{ matrix.cmake_args }}
            cmake --build "${{ github.workspace }}/build-${{ matrix.target }}-${ARCH}"
          done
          mkdir -p "${{ github.workspace }}/out/${{ matrix.target }}"
          lipo -create \
            "${{ github.workspace }}/out/${{ matrix.target }}-arm64/${{ matrix.target }}" \
            "${{ github.workspace }}/out/${{ matrix.target }}-x86_64/${{ matrix.target }}" \
            -output "${{ github.workspace }}/out/${{ matrix.target }}/${{ matrix.target }}"
          lipo -info "${{ github.workspace }}/out/${{ matrix.target }}/${{ matrix.target }}"
          rm -rf "${{ github.workspace }}/out/${{ matrix.target }}-arm64" \
                 "${{ github.workspace }}/out/${{ matrix.target }}-x86_64"

      - name: Upload artifacts (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: shandalar-${{ matrix.target }}-macos-universal
          path: ${{ github.workspace }}/out/${{ matrix.target }}/
