name: Emscripten Build

on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: facemaker
            cmake_args: -DSHANDALAR_BUILD_FACEMAKER=ON -DSHANDALAR_BUILD_SHANDALAR=OFF -DSHANDALAR_BUILD_DECK=OFF
          - target: shandalar
            cmake_args: -DSHANDALAR_BUILD_FACEMAKER=OFF -DSHANDALAR_BUILD_SHANDALAR=ON -DSHANDALAR_BUILD_DECK=OFF
          - target: deck
            cmake_args: -DSHANDALAR_BUILD_FACEMAKER=OFF -DSHANDALAR_BUILD_SHANDALAR=OFF -DSHANDALAR_BUILD_DECK=ON

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: emscripten-core/setup-emsdk@v1
        with:
          version: 6.0.0

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Configure CMake (${{ matrix.target }})
        run: |
          emcmake cmake -S "${{ github.workspace }}" \
                       -B "${{ github.workspace }}/build-${{ matrix.target }}" \
                       -G Ninja \
                       -DCMAKE_BUILD_TYPE=MinSizeRel \
                       -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="${{ github.workspace }}/out/${{ matrix.target }}" \
                       -DSHANDALAR_ASSET_DIR="${{ github.workspace }}/assets" \
                       -DSHANDALAR_BUILD_TESTS=OFF \
                       ${{ matrix.cmake_args }}

      - name: Build (${{ matrix.target }})
        run: cmake --build "${{ github.workspace }}/build-${{ matrix.target }}"

      - name: Upload artifacts (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: shandalar-${{ matrix.target }}-wasm
          path: ${{ github.workspace }}/out/${{ matrix.target }}/
